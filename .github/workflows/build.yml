name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (GCC, system SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends libsdl2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Headless smoke test
        run: ./build/frontier --headless=60

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: frontier-linux-x64
          path: |
            build/frontier
            build/assets
          if-no-files-found: error

  windows:
    name: Windows (MSVC, fetched SDL2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DFRONTIER_FETCH_SDL2=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path build.log) {
            $body = Get-Content build.log -Raw
            if ($body.Length -gt 60000) { $body = $body.Substring($body.Length - 60000) }
            gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body=$body
          }

      - name: Headless smoke test
        run: .\build\Release\frontier.exe --headless=60

      - name: Stage a self-contained folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\frontier.exe dist\
          if (Test-Path build\Release\SDL2.dll) { Copy-Item build\Release\SDL2.dll dist\ }
          Copy-Item build\Release\assets dist\assets -Recurse
          Get-ChildItem dist

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: frontier-windows-x64
          path: dist
          if-no-files-found: error
