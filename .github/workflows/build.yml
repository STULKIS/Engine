name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (GCC, fetched SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (fetches SDL2)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFRONTIER_FETCH_SDL2=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Headless smoke test
        run: ./build/frontier --headless=60

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: frontier-linux-x64
          path: |
            build/frontier
            build/assets
          if-no-files-found: error

  windows:
    name: Windows (MSVC, fetched SDL2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DFRONTIER_FETCH_SDL2=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report compiler errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host "no build log"; exit 0 }
          $errors = Select-String -Path build.log -Pattern '(?i)error [A-Z]+[0-9]+|fatal error|error LNK[0-9]+'
          $count = 0
          foreach ($e in $errors) {
            if ($count -ge 10) { break }
            Write-Host "::error file=build::$($e.Line.Trim())"
            $count++
          }
          Write-Host "reported $count errors"

      - name: Headless smoke test
        run: .\build\Release\frontier.exe --headless=60

      - name: Stage a self-contained folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\frontier.exe dist\
          if (Test-Path build\Release\SDL2.dll) { Copy-Item build\Release\SDL2.dll dist\ }
          Copy-Item build\Release\assets dist\assets -Recurse
          Copy-Item scripts\run_windows.bat dist\run.bat
          @"
Frontier Engine - quick start
=============================
1. Start the game:      run.bat            (keeps the console window open)
   or directly:         frontier.exe
2. Verify this machine: frontier.exe --selftest
   It renders a frame, checks the pixels and writes screenshots\selftest.ppm.
3. If it does not start, run run.bat and read the message, or open
   frontier.log in this folder. Common causes:
   - GPU driver older than OpenGL 4.5 (update it, avoid remote desktop)
   - an antivirus quarantined frontier.exe (restore/allow it)
   - assets\ is missing (keep it next to the executable)
Only MSAA/HDR/bloom and the world size are tuned by safe mode:
   frontier.exe --safe-mode
"@ | Set-Content -Encoding ASCII dist\README.txt
          Get-ChildItem dist

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: frontier-windows-x64
          path: dist
          if-no-files-found: error
